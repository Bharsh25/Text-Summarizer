<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialogue Summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
    --ink:#14181c;
    --ink-2:#1c2127;
    --paper:#f0ece1;
    --paper-dim:#c9c3b2;
    --brass:#c98a3b;
    --brass-bright:#e6a94f;
    --signal:#4fa98c;
    --rust:#b24c3d;
    --line: rgba(240,236,225,0.14);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
    background:
    radial-gradient(circle at 15% 0%, rgba(201,138,59,0.08), transparent 45%),
    radial-gradient(circle at 90% 80%, rgba(79,169,140,0.06), transparent 40%),
    var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 80px;
}

/* ---------- Header ---------- */
.masthead{
    width:100%;
    max-width:980px;
    text-align:center;
    margin-bottom:10px;
}
.eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.32em;
    color:var(--brass-bright);
    text-transform:uppercase;
    margin-bottom:14px;
}
.eyebrow::before, .eyebrow::after{
    content:"—";
    color:var(--paper-dim);
    margin:0 10px;
}
h1{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:clamp(34px,6vw,58px);
    letter-spacing:-.01em;
    margin:0 0 8px;
}
h1 span{color:var(--signal);}
.sub{
    font-size:15px;
    color:var(--paper-dim);
    max-width:520px;
    margin:0 auto;
    line-height:1.6;
}
.sub b{color:var(--paper);font-weight:600;}

/* ---------- Desk / main panel ---------- */
.desk{
    width:100%;
    max-width:980px;
    margin-top:46px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:4px;
    position:relative;
    display:grid;
    grid-template-columns:1fr 88px 1fr;
    overflow:hidden;
}
.desk::before{ /* top brass strip */
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--brass),var(--signal));
}

.pane{
    padding:30px 28px 28px;
    display:flex;
    flex-direction:column;
}
.pane-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--paper-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}
.pane-label .tag-in{color:var(--brass-bright);}
.pane-label .tag-out{color:var(--signal);}
.count{
    font-variant-numeric:tabular-nums;
    color:var(--paper);
    opacity:.75;
}

textarea{
    width:100%;
    flex:1;
    min-height:260px;
    resize:vertical;
    background:
    repeating-linear-gradient(180deg, transparent 0 27px, rgba(255,255,255,0.015) 27px 28px);
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px;
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:15.5px;
    line-height:1.7;
    outline:none;
    transition:border-color .2s ease;
}
textarea::placeholder{
    color:var(--paper-dim);
    font-style:italic;
    font-size:14px;
}
textarea:focus{border-color:var(--brass);}

.output-box{
    flex:1;
    min-height:260px;
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px;
    font-size:15.5px;
    line-height:1.7;
    color:var(--paper);
    background:
    repeating-linear-gradient(180deg, transparent 0 27px, rgba(255,255,255,0.015) 27px 28px);
    position:relative;
}
.output-box.empty{
    color:var(--paper-dim);
    font-style:italic;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}
.output-box .cursor{
    display:inline-block;
    width:8px;height:16px;
    background:var(--signal);
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0;}}

.gauge-col{
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 0;
    gap:16px;
    position:relative;
}
.gauge-col::before, .gauge-col::after{ 
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:6px;height:6px;
    border-radius:50%;
    background:var(--ink);
    border:1px solid var(--line);
}
.gauge-col::before{top:14px;}
.gauge-col::after{bottom:14px;}

.gauge{
    width:44px;height:44px;
    border-radius:50%;
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    position:relative;
}
.gauge svg{position:absolute;top:-2px;left:-2px;}
.gauge-pct{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:600;
    color:var(--brass-bright);
}
.gauge-caption{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    letter-spacing:.12em;
    color:var(--paper-dim);
    text-transform:uppercase;
    text-align:center;
    writing-mode:vertical-rl;
    transform:rotate(180deg);
}

.arrow-flow{
    font-size:18px;
    color:var(--paper-dim);
}

/* ---------- Controls ---------- */
.controls{
    width:100%;
    max-width:980px;
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:22px;
}
button.press{
    flex:1;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:16px 20px;
    border:1px solid var(--brass);
    background:var(--brass);
    color:var(--ink);
    border-radius:3px;
    cursor:pointer;
    transition:background .18s ease, transform .05s ease, box-shadow .18s ease;
    box-shadow:0 0 0 0 rgba(201,138,59,0.4);
}
button.press:hover{background:var(--brass-bright);box-shadow:0 0 24px rgba(201,138,59,0.25);}
button.press:active{transform:scale(.99);}
button.press:disabled{opacity:.55;cursor:progress;}

button.clear{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:16px 18px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper-dim);
    border-radius:3px;
    cursor:pointer;
    transition:border-color .18s ease,color .18s ease;
}
button.clear:hover{border-color:var(--rust);color:var(--rust);}

.example-row{
    width:100%;
    max-width:980px;
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
}
.example-row span.lbl{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--paper-dim);
    align-self:center;
    margin-right:2px;
}
.chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:7px 12px;
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--paper-dim);
    background:transparent;
    cursor:pointer;
    transition:all .15s ease;
}
.chip:hover{border-color:var(--signal);color:var(--signal);}


@media (max-width:760px){
    .desk{grid-template-columns:1fr;}
    .gauge-col{
    flex-direction:row;
    border-left:none;border-right:none;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:14px 0;
    }
    .gauge-col::before,.gauge-col::after{display:none;}
    .gauge-caption{writing-mode:horizontal-tb;transform:none;}
}

@media (prefers-reduced-motion: reduce){
    .cursor{animation:none;}
    *{transition:none !important;}
}
</style>
</head>
<body>

<div class="masthead">
    <div class="eyebrow">Fine-tuned T5 Model</div>
    <h1>Dialogue <span>Summarizer</span></h1>
    <p class="sub">Paste a conversation. The model strips the back-and-forth and prints
    the -> one clean line of what actually happened.</p>
</div>

<div class="desk">
    <div class="pane">
    <div class="pane-label">
        <span class="tag-in">Transmission In</span>
        <span class="count" id="inCount">0 tokens</span>
    </div>
    <textarea id="dialogueInput" placeholder="Paste your conversation here..."></textarea>
    </div>

    <div class="gauge-col">
    <div class="gauge">
        <svg width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="19" fill="none" stroke="rgba(240,236,225,0.08)" stroke-width="3"/>
        <circle id="gaugeRing" cx="22" cy="22" r="19" fill="none" stroke="#4fa98c" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4"
                transform="rotate(-90 22 22)" style="transition:stroke-dashoffset .6s ease;"/>
        </svg>
        <span class="gauge-pct" id="gaugePct">0%</span>
    </div>
    <span class="gauge-caption">Compression</span>
    </div>

    <div class="pane">
    <div class="pane-label">
        <span class="tag-out">Signal Out</span>
        <span class="count" id="outCount">0 tokens</span>
    </div>
    <div class="output-box empty" id="outputBox">Summary will print here once the press summarize.</div>
    </div>
</div>

<div class="controls">
    <button class="press" id="runBtn">▸ Summarize</button>
    <button class="clear" id="clearBtn">Clear</button>
</div>

<div class="example-row">
    <span class="lbl">Try:</span>
    <button class="chip" data-ex="0">Cookies plan</button>
    <button class="chip" data-ex="1">Weekend trek</button>
    <button class="chip" data-ex="2">Late for work</button>
</div>


<script>

async function callSummarizer(dialogue){
try{
    const res = await fetch('/summarize/', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ dialogue })
    });
    if(!res.ok) throw new Error('backend error: ' + res.status);
    const data = await res.json();
    return data.summary;
}catch(e){
    // Demo fallback so the page still works without a backend wired up.
    return demoSummarize(dialogue);
}
}

function demoSummarize(text){
const sentences = text.trim().split('\n').filter(Boolean);
if(sentences.length === 0) return '';
const names = [...new Set(sentences.map(s => s.split(':')[0].trim()).filter(n => n && n.length < 20))];
const who = names.length ? names.join(' and ') : 'They';
return `${who} discussed plans and agreed on the details mentioned above.`;
}

const examples = [
`Amanda: I baked cookies. Do you want some?
Jerry: Sure!
Amanda: I'll bring you tomorrow :-)`,
`Rahul: Hey, are you free this weekend?
Priya: Yeah, why?
Rahul: I was thinking we could go trekking near Lonavala.
Priya: That sounds great! What time should we leave?
Rahul: Let's leave by 6 AM to avoid traffic.
Priya: Okay, I'll be ready. Should I bring snacks?
Rahul: Yes please, and some water bottles too.`,
`Sam: I'm running late, stuck in traffic.
Boss: How late?
Sam: Maybe 20 minutes, sorry!
Boss: No worries, let me know when you're close.`
];

const dialogueInput = document.getElementById('dialogueInput');
const outputBox = document.getElementById('outputBox');
const runBtn = document.getElementById('runBtn');
const clearBtn = document.getElementById('clearBtn');
const inCount = document.getElementById('inCount');
const outCount = document.getElementById('outCount');
const gaugeRing = document.getElementById('gaugeRing');
const gaugePct = document.getElementById('gaugePct');

const CIRC = 119.4;

function wc(str){
return str.trim() ? str.trim().split(/\s+/).length : 0;
}

function updateInCount(){
inCount.textContent = wc(dialogueInput.value) + ' tokens';
}
dialogueInput.addEventListener('input', updateInCount);

function setGauge(inWords, outWords){
let pct = 0;
if(inWords > 0 && outWords >= 0){
    pct = Math.max(0, Math.min(100, Math.round((1 - outWords / inWords) * 100)));
}
const offset = CIRC - (CIRC * pct / 100);
gaugeRing.style.strokeDashoffset = offset;
gaugePct.textContent = pct + '%';
}

document.querySelectorAll('.chip').forEach(chip=>{
chip.addEventListener('click', ()=>{
    dialogueInput.value = examples[chip.dataset.ex];
    updateInCount();
    dialogueInput.focus();
});
});

clearBtn.addEventListener('click', ()=>{
dialogueInput.value = '';
updateInCount();
outputBox.textContent = 'Summary will print here once the press runs.';
outputBox.classList.add('empty');
outCount.textContent = '0 tokens';
setGauge(0,0);
});

runBtn.addEventListener('click', async ()=>{
const text = dialogueInput.value.trim();
if(!text){
    dialogueInput.focus();
    dialogueInput.style.borderColor = '#b24c3d';
    setTimeout(()=> dialogueInput.style.borderColor = '', 500);
    return;
}

runBtn.disabled = true;
runBtn.textContent = '▸ Summarizing…';
outputBox.classList.remove('empty');
outputBox.innerHTML = '<span class="cursor"></span>';

const summary = await callSummarizer(text);

// simple typewriter print for the "press" feel
outputBox.textContent = '';
let i = 0;
const speed = 14;
function type(){
    if(i <= summary.length){
    outputBox.textContent = summary.slice(0, i);
    outputBox.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
    i++;
    setTimeout(type, speed);
    }else{
    outputBox.textContent = summary;
    outCount.textContent = wc(summary) + ' tokens';
    setGauge(wc(text), wc(summary));
    runBtn.disabled = false;
    runBtn.textContent = '▸ Summarize';
    }
}
type();
});

updateInCount();
</script>
</body>
</html>
